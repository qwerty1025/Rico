<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoatCRM | 智能憑證辨識模組 (RapidOCR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; overscroll-behavior-y: none; }
        #canvas-container { 
            position: relative; 
            overflow: hidden; 
            border: 2px dashed #cbd5e1; 
            border-radius: 0.5rem;
            cursor: crosshair; 
            touch-action: none;
            background-color: #ffffff;
            min-height: 300px;
            transition: all 0.3s ease;
        }
        #canvas-container.has-image { border: 1px solid #e2e8f0; background-color: #f1f5f9; }
        canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; }
        .mode-btn { transition: all 0.2s ease; }
        .mode-btn:active { transform: scale(0.95); }
        .mode-btn.active { 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }
        
        /* 隱藏捲軸但保留滾動功能 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="font-sans text-slate-800 h-screen flex flex-col">

    <!-- 頂部導航欄 (Navbar) -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-500 text-white p-2 rounded-lg">
                        <i class="fa-solid fa-receipt text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wider">GoatCRM <span class="text-indigo-400">OCR</span></h1>
                        <p class="text-xs text-slate-400">RapidOCR 智慧憑證解析核心</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4 text-sm">
                    <span class="hidden md:flex items-center text-emerald-400">
                        <span class="relative flex h-3 w-3 mr-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        API 連線正常
                    </span>
                    <button class="text-slate-300 hover:text-white transition"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-grow overflow-auto p-4 md:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
            
            <!-- 左側：工作區 (佔 7 欄) -->
            <div class="lg:col-span-7 flex flex-col space-y-4">
                <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-100 flex-grow flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold text-slate-700 flex items-center">
                            <i class="fa-regular fa-image text-indigo-500 mr-2"></i> 憑證掃描區
                        </h2>
                        <label class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
                            <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 上傳圖片
                            <input type="file" id="fileInput" class="hidden" accept="image/*">
                        </label>
                    </div>
                    
                    <!-- 畫布容器 -->
                    <div id="canvas-container" class="flex-grow flex items-center justify-center">
                        <div id="placeholder" class="text-center text-slate-400 pointer-events-none">
                            <i class="fa-solid fa-camera text-4xl mb-2 opacity-50"></i>
                            <p class="text-sm font-medium">點擊右上角按鈕上傳請款單</p>
                        </div>
                        <canvas id="mainCanvas" class="hidden"></canvas>
                    </div>
                </div>
            </div>

            <!-- 右側：控制面板 (佔 5 欄) -->
            <div class="lg:col-span-5 flex flex-col space-y-4">
                
                <!-- 步驟 1：標記工具 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 text-sm mb-3 flex items-center">
                        <span class="bg-slate-800 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs mr-2">1</span>
                        選擇資料型態並畫框
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="mode-btn bg-emerald-50 text-emerald-700 border border-emerald-200 py-2.5 rounded-xl text-sm font-bold" data-mode="invoice" data-color="#10b981">
                            <i class="fa-solid fa-hashtag mr-1"></i> 發票號碼
                        </button>
                        <button class="mode-btn bg-rose-50 text-rose-700 border border-rose-200 py-2.5 rounded-xl text-sm font-bold" data-mode="title" data-color="#f43f5e">
                            <i class="fa-solid fa-building mr-1"></i> 賣方抬頭
                        </button>
                        <button class="mode-btn bg-blue-50 text-blue-700 border border-blue-200 py-2.5 rounded-xl text-sm font-bold" data-mode="taxid" data-color="#3b82f6">
                            <i class="fa-solid fa-id-card mr-1"></i> 賣方統編
                        </button>
                        <button class="mode-btn bg-amber-50 text-amber-700 border border-amber-200 py-2.5 rounded-xl text-sm font-bold" data-mode="amount" data-color="#f59e0b">
                            <i class="fa-solid fa-sack-dollar mr-1"></i> 總計金額
                        </button>
                    </div>
                    
                    <button id="startScanBtn" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-md transition flex justify-center items-center">
                        <i class="fa-solid fa-bolt mr-2"></i> 啟動 RapidOCR 解析
                    </button>
                    
                    <!-- 載入狀態 -->
                    <div id="statusArea" class="mt-3 text-sm font-medium text-indigo-600 hidden flex items-center justify-center bg-indigo-50 py-2 rounded-lg">
                        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> <span id="statusText">RapidOCR 模型推論中...</span>
                    </div>
                </div>

                <!-- 步驟 2：輸出結果 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex-grow flex flex-col">
                    <h3 class="font-bold text-slate-700 text-sm mb-3 flex items-center justify-between">
                        <div class="flex items-center">
                            <span class="bg-slate-800 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs mr-2">2</span>
                            LINE 群組自動回報格式
                        </div>
                        <button id="clearBtn" class="text-xs text-rose-500 hover:bg-rose-50 px-2 py-1 rounded transition">清除重來</button>
                    </h3>
                    
                    <div class="relative flex-grow flex flex-col">
                        <textarea id="lineOutput" class="w-full flex-grow p-4 bg-slate-800 text-emerald-400 font-mono text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner resize-none" readonly style="min-height: 180px;">📌 【請款回報】
----------------------
🧾 發票號碼：
🏢 賣方抬頭：
🏷️ 賣方統編：
💰 總計金額：
----------------------
備註：無</textarea>
                        
                        <button id="copyBtn" class="absolute bottom-4 right-4 bg-white/10 hover:bg-white/20 text-white backdrop-blur-sm px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
                            <i class="fa-regular fa-copy mr-2"></i> 複製
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- 用於裁切影像的隱藏 Canvas -->
    <canvas id="cropCanvas" class="hidden"></canvas>

    <script>
        // DOM 元素選取
        const fileInput = document.getElementById('fileInput');
        const mainCanvas = document.getElementById('mainCanvas');
        const placeholder = document.getElementById('placeholder');
        const canvasContainer = document.getElementById('canvas-container');
        const ctx = mainCanvas.getContext('2d');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropCtx = cropCanvas.getContext('2d');
        const lineOutput = document.getElementById('lineOutput');
        const statusArea = document.getElementById('statusArea');
        const modeBtns = document.querySelectorAll('.mode-btn');

        let img = new Image();
        let imageLoaded = false;
        let scale = 1;
        let drawnBoxes = {};
        
        let currentMode = null;
        let currentColor = null;
        let isDrawing = false;
        let startX, startY;
        let ocrResults = {}; 

        // 處理圖片上傳
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    imageLoaded = true;
                    drawnBoxes = {}; 
                    ocrResults = {};
                    updateLineOutput();
                    
                    placeholder.classList.add('hidden');
                    mainCanvas.classList.remove('hidden');
                    canvasContainer.classList.add('has-image');
                    
                    const maxWidth = canvasContainer.clientWidth - 20; // 保留內邊距
                    
                    scale = maxWidth / img.width;
                    if(scale > 1) scale = 1; 
                    
                    mainCanvas.width = img.width * scale;
                    mainCanvas.height = img.height * scale;
                    redrawCanvas();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 選擇標記類型按鈕樣式切換
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                modeBtns.forEach(b => b.classList.remove('active', 'ring-2', 'ring-offset-2'));
                const target = e.currentTarget;
                
                // 根據按鈕顏色設定 ring
                let ringColor = '';
                if(target.dataset.mode === 'invoice') ringColor = 'ring-emerald-500';
                if(target.dataset.mode === 'title') ringColor = 'ring-rose-500';
                if(target.dataset.mode === 'taxid') ringColor = 'ring-blue-500';
                if(target.dataset.mode === 'amount') ringColor = 'ring-amber-500';

                target.classList.add('active', 'ring-2', 'ring-offset-2', ringColor);
                currentMode = target.dataset.mode;
                currentColor = target.dataset.color;
            });
        });

        // --- 畫布互動邏輯 (支援滑鼠與觸控) ---
        function getCoords(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDraw(e) {
            if (!imageLoaded || !currentMode) return;
            if (e.touches && e.cancelable) e.preventDefault(); 
            isDrawing = true;
            const coords = getCoords(e);
            startX = coords.x;
            startY = coords.y;
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            if (e.touches && e.cancelable) e.preventDefault();
            const coords = getCoords(e);
            
            redrawCanvas();
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]); 
            ctx.strokeRect(startX, startY, coords.x - startX, coords.y - startY);
            ctx.setLineDash([]);
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = mainCanvas.getBoundingClientRect();
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const endX = clientX - rect.left;
            const endY = clientY - rect.top;
            
            const box = {
                x: Math.min(startX, endX) / scale,
                y: Math.min(startY, endY) / scale,
                w: Math.abs(endX - startX) / scale,
                h: Math.abs(endY - startY) / scale,
                color: currentColor
            };

            if(box.w > 10 && box.h > 10) {
                drawnBoxes[currentMode] = box;
            }
            redrawCanvas();
        }

        mainCanvas.addEventListener('mousedown', startDraw);
        mainCanvas.addEventListener('mousemove', moveDraw);
        mainCanvas.addEventListener('mouseup', endDraw);
        mainCanvas.addEventListener('mouseout', () => { if(isDrawing) isDrawing = false; redrawCanvas(); });

        mainCanvas.addEventListener('touchstart', startDraw, { passive: false });
        mainCanvas.addEventListener('touchmove', moveDraw, { passive: false });
        mainCanvas.addEventListener('touchend', endDraw);

        function redrawCanvas() {
            if(!imageLoaded) return;
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
            
            Object.values(drawnBoxes).forEach(box => {
                ctx.strokeStyle = box.color;
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x * scale, box.y * scale, box.w * scale, box.h * scale);
                // 半透明填充
                ctx.fillStyle = box.color + '26'; // 15% 透明度
                ctx.fillRect(box.x * scale, box.y * scale, box.w * scale, box.h * scale);
            });
        }

        // --- RapidOCR 串接處理 ---
        document.getElementById('startScanBtn').addEventListener('click', async () => {
            const modes = Object.keys(drawnBoxes);
            if (modes.length === 0) {
                alert("請先在左側圖片上標記至少一個資料區塊！");
                return;
            }

            statusArea.classList.remove('hidden');
            const btn = document.getElementById('startScanBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 處理中...';

            for (let mode of modes) {
                const box = drawnBoxes[mode];
                cropCanvas.width = box.w;
                cropCanvas.height = box.h;
                cropCtx.drawImage(img, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
                
                const base64Image = cropCanvas.toDataURL('image/jpeg', 0.9);

                try {
                    // 呼叫 RapidOCR
                    const text = await callRapidOcrAPI(base64Image);
                    ocrResults[mode] = text;
                } catch (err) {
                    console.error("API 錯誤", err);
                    ocrResults[mode] = "讀取失敗";
                }
            }

            updateLineOutput();
            statusArea.classList.add('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            btn.innerHTML = originalBtnHtml;
        });

        // 模擬串接 RapidOCR API 的函數
        async function callRapidOcrAPI(base64Str) {
            /* 
            實際部署時，請將以下 fetch 取代這段模擬 Promise。
            只需在您的 Python 後端 (如 FastAPI) 安裝 rapidocr-onnxruntime 即可接收解析。
            
            const response = await fetch('http://您的API主機網址/api/rapidocr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_base64: base64Str })
            });
            const data = await response.json();
            return data.text;
            */
            
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve("RapidOCR_測試文字"); 
                }, 400); // 模擬 RapidOCR 的高速推論 (通常比原生 PaddleOCR 快)
            });
        }

        function updateLineOutput() {
            lineOutput.value = `📌 【請款回報】
----------------------
🧾 發票號碼：${ocrResults['invoice'] || ''}
🏢 賣方抬頭：${ocrResults['title'] || ''}
🏷️ 賣方統編：${ocrResults['taxid'] || ''}
💰 總計金額：${ocrResults['amount'] || ''}
----------------------
備註：無`;
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            drawnBoxes = {};
            ocrResults = {};
            redrawCanvas();
            updateLineOutput();
        });

        document.getElementById('copyBtn').addEventListener('click', async () => {
            await navigator.clipboard.writeText(lineOutput.value);
            const btn = document.getElementById('copyBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400 mr-2"></i> 已複製';
            setTimeout(() => {
                btn.innerHTML = originalHtml;
            }, 2000);
        });
    </script>
</body>
</html>
