<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>發票/請款單 智慧解析工具 (QR版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入開源的 QR Code 解碼庫 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; }
        .drop-zone { border: 2px dashed #9ca3af; transition: all 0.3s ease; }
        .drop-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-gray-900"><i class="fa-solid fa-qrcode text-blue-600 mr-2"></i>發票/請款單 智慧解析工具</h1>
            <p class="text-gray-500">採用 QR Code 毫秒級解碼技術，100% 準確率，無視防偽底紋干擾</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左側：上傳區 -->
            <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                <h2 class="text-xl font-semibold border-b pb-2">1. 載入憑證圖片</h2>
                
                <div id="dropZone" class="drop-zone flex flex-col items-center justify-center p-8 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 min-h-[300px] relative">
                    <input type="file" id="fileInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*">
                    <i class="fa-solid fa-cloud-arrow-up text-5xl text-gray-400 mb-4"></i>
                    <p class="font-medium text-gray-600">點擊選擇圖片或將圖片拖曳至此</p>
                    <p class="text-sm text-gray-400 mt-2">支援含有 QR Code 的電子發票證明聯</p>
                    
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-contain bg-white rounded-lg p-2" src="" alt="預覽圖片">
                </div>
            </div>

            <!-- 右側：解析結果區 -->
            <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col h-full">
                <h2 class="text-xl font-semibold border-b pb-2 flex justify-between items-center">
                    <span>2. LINE 回報資訊</span>
                    <div id="loadingIndicator" class="hidden flex items-center text-sm text-blue-600 font-medium">
                        <div class="loader mr-2"></div> 解析中...
                    </div>
                </h2>

                <div id="resultState" class="flex-grow flex flex-col items-center justify-center text-gray-400 py-12">
                    <i class="fa-solid fa-robot text-6xl mb-4 text-gray-300"></i>
                    <p>等待圖片載入中...</p>
                </div>

                <div id="successState" class="hidden flex-grow flex flex-col mt-4 space-y-4">
                    <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-start">
                        <i class="fa-solid fa-circle-check mt-1 mr-3"></i>
                        <div>
                            <p class="font-bold">QR Code 解析成功！</p>
                            <p class="text-sm">已精準提取標準化發票資訊，無需依賴傳統 OCR。</p>
                        </div>
                    </div>

                    <!-- LINE 文字框 -->
                    <div class="relative flex-grow flex flex-col">
                        <textarea id="lineOutputText" class="w-full flex-grow p-4 bg-gray-800 text-green-400 font-mono text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" readonly style="min-height: 200px;"></textarea>
                        
                        <button id="copyBtn" class="absolute top-3 right-3 bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-md text-sm transition flex items-center backdrop-blur-sm">
                            <i class="fa-regular fa-copy mr-1"></i> 複製回報
                        </button>
                    </div>
                </div>

                <div id="errorState" class="hidden mt-4 bg-red-50 border border-red-200 text-red-600 p-4 rounded-lg flex items-start">
                    <i class="fa-solid fa-triangle-exclamation mt-1 mr-3"></i>
                    <div>
                        <p class="font-bold">解析失敗或非標準電子發票</p>
                        <p class="text-sm mt-1" id="errorMessage">無法在圖片中找到清晰的 QR Code。若是傳統請款單，建議切換至版面配置辨識 (Layout OCR) 或雲端商用 API (如 Google Cloud Vision)。</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 隱藏的 Canvas 用於處理圖片數據 -->
    <canvas id="processCanvas" class="hidden"></canvas>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const imagePreview = document.getElementById('imagePreview');
        const processCanvas = document.getElementById('processCanvas');
        const ctx = processCanvas.getContext('2d', { willReadFrequently: true });
        
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultState = document.getElementById('resultState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const lineOutputText = document.getElementById('lineOutputText');
        const copyBtn = document.getElementById('copyBtn');
        const errorMessage = document.getElementById('errorMessage');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;

            resultState.classList.add('hidden');
            successState.classList.add('hidden');
            errorState.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.classList.remove('hidden');
                
                const img = new Image();
                img.onload = () => {
                    processCanvas.width = img.width;
                    processCanvas.height = img.height;
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    
                    const imageData = ctx.getImageData(0, 0, processCanvas.width, processCanvas.height);
                    
                    setTimeout(() => {
                        decodeInvoiceQR(imageData);
                    }, 500);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 台灣電子發票 QR Code 解析邏輯
        function decodeInvoiceQR(imageData) {
            loadingIndicator.classList.add('hidden');
            
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert", 
            });

            if (code) {
                const qrText = code.data;
                // 台灣電子發票左側 QR 格式檢查
                if (qrText.length >= 77 && /^[A-Z]{2}\d{8}/.test(qrText)) {
                    try {
                        const invoiceNum = qrText.substring(0, 10);
                        const rocYear = qrText.substring(10, 13);
                        const month = qrText.substring(13, 15);
                        const day = qrText.substring(15, 17);
                        const dateFormatted = `${parseInt(rocYear) + 1911}/${month}/${day}`; // 民國轉西元
                        
                        // 總金額在 QR code 中是十六進位 (位置 29~36)
                        const totalHex = qrText.substring(29, 37);
                        const totalAmount = parseInt(totalHex, 16);
                        
                        const sellerId = qrText.substring(45, 53);

                        generateLineReport(invoiceNum, sellerId, dateFormatted, totalAmount);
                    } catch (e) {
                        showError("QR Code 內容格式無法解析，可能不是標準電子發票。");
                    }
                } else {
                    showError("找到 QR Code，但不是台灣電子發票的標準格式。");
                }
            } else {
                showError("無法在圖片中辨識出 QR Code。如果是純文字傳統請款單，需改用 Cloud OCR 方案 (如 Google Vision)。");
            }
        }

        function generateLineReport(invoiceNum, sellerId, date, amount) {
            const reportText = `📌 【請款回報】
----------------------
🧾 發票號碼：${invoiceNum}
🏢 賣方統編：${sellerId}
📅 消費日期：${date}
💰 總計金額：$${amount.toLocaleString()}
----------------------
備註：無`;

            lineOutputText.value = reportText;
            successState.classList.remove('hidden');
        }

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(lineOutputText.value);
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> 已複製';
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                }, 3000);
            } catch (err) {
                alert('複製失敗，請手動選取複製');
            }
        });
    </script>
</body>
</html>
